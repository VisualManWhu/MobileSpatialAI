<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Recon3D 查看器</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #111; }
    /* position:fixed is required: on Android WebView (Pixel 10 Pro, WebView 156) an in-flow
       canvas is never composited to the screen (stays black) although it renders fine. */
    canvas { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }
    /* 漫游 (free-fly) overlay: a toggle button and two joysticks, all above the canvas. */
    #roam-toggle {
      position: fixed; top: 12px; right: 12px; z-index: 2;
      padding: 6px 14px; border-radius: 999px; font: 14px system-ui, sans-serif; color: #fff;
      background: rgba(255, 255, 255, 0.18); border: 1px solid rgba(255, 255, 255, 0.6);
      touch-action: none; -webkit-tap-highlight-color: transparent; user-select: none;
    }
    .stick {
      position: fixed; bottom: 28px; z-index: 2; width: 140px; height: 140px; border-radius: 50%;
      background: rgba(255, 255, 255, 0.08); border: 1.5px solid rgba(255, 255, 255, 0.5);
      touch-action: none; user-select: none;
    }
    #stick-move { left: 28px; }
    #stick-look { right: 28px; }
    .knob {
      position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px;
      border-radius: 50%; background: rgba(255, 255, 255, 0.75); pointer-events: none;
    }
    body:not(.roam) .stick { display: none; }
  </style>
</head>
<body>
  <button id="roam-toggle" type="button" hidden>漫游</button>
  <div id="stick-move" class="stick"><div class="knob"></div></div>
  <div id="stick-look" class="stick"><div class="knob"></div></div>
  <!-- Runs before the bundle: if viewer.js fails to load/parse or anything throws outside
       boot()'s try, the app still gets exactly one onError instead of spinning forever. -->
  <script>
    (function () {
      var reported = false;
      window.__r3dReport = function (kind, arg) {
        if (reported) return;
        reported = true;
        var a = window.Android;
        if (!a) return;
        if (kind === "loaded") a.onLoaded(arg); else a.onError(arg);
      };
      function fail(e) {
        if (window.console) console.error("viewer error", e && (e.error || e.reason || e.message || e));
        window.__r3dReport("error", "场景文件加载失败");
      }
      // capture=true also sees <script> resource load failures, which don't bubble.
      window.addEventListener("error", fail, true);
      window.addEventListener("unhandledrejection", fail);
    })();
  </script>
  <!-- Bundled three.js + Spark; everything is served from the APK assets (no network). -->
  <script type="module" src="viewer.js"></script>
</body>
</html>
