[project]
name = "recon3d"
version = "0.1.0"
description = "Recon3D server: phone capture to 3D Gaussian Splatting reconstruction"
# gsplat publishes prebuilt (no-nvcc) wheels for cp310 only, hence Python 3.10.
requires-python = ">=3.10,<3.11"
dependencies = [
    "pydantic>=2.5",
    "numpy>=1.26",
    "pillow>=10.0",
    "torch==2.4.1",
    "scipy>=1.11",  # cKDTree for Gaussian scale init
    # Prebuilt CUDA wheel from the gsplat index; Linux only (see [tool.uv.sources]).
    "gsplat==1.5.3; sys_platform == 'linux'",
    # gsplat's loader imports torch.utils.cpp_extension, which imports setuptools.
    "setuptools; sys_platform == 'linux'",
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "python-multipart>=0.0.32",
    # Depth Anything V2 (recon/mono_depth.py); 5.x needs torch >= 2.6.
    "transformers>=4.45,<5",
    # CPU SIFT + mapper for precise mode (recon/precise_pose.py)
    "pycolmap==4.2.1",
]

[project.scripts]
recon3d-server = "recon3d.main:cli"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["recon3d"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    # starlette 1.x nudges toward the httpx2 fork; httpx works fine for TestClient.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
markers = [
    "gpu: needs a CUDA GPU (auto-skipped when torch.cuda.is_available() is False)",
    "slow: CPU-heavy (pycolmap SIFT + mapper), minutes not seconds",
]

# torch 2.4.x + CUDA 12.4 matches the gsplat "pt24cu124" prebuilt wheel tag.
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.index]]
name = "gsplat-pt24cu124"
url = "https://docs.gsplat.studio/whl/pt24cu124"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu124", marker = "sys_platform == 'linux'" }]
gsplat = [{ index = "gsplat-pt24cu124", marker = "sys_platform == 'linux'" }]
